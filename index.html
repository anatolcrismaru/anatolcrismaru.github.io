<head>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a1a;--panel:rgba(255,255,255,.05);--line:rgba(255,255,255,.12);--text:#eceaff;--muted:#a29fc4;--dim:#5b5880;
  --violet:#7c3aed;--blue:#3b82f6;--teal:#22e5c9;--field:rgba(10,8,30,.6);--nav:rgba(20,16,50,.65);--modal:#17133a;--ovl:rgba(12,9,35,.94);
  --g1:rgba(124,58,237,.35);--g2:rgba(34,229,201,.18);--grad:linear-gradient(135deg,var(--violet),var(--blue) 55%,var(--teal))}
[data-theme="light"]{--bg:#f5f4ff;--panel:rgba(255,255,255,.75);--line:rgba(40,30,100,.15);--text:#1b1840;--muted:#5d5a85;--dim:#b3b0d0;
  --field:#fff;--nav:rgba(255,255,255,.8);--modal:#fff;--ovl:rgba(255,255,255,.96);--g1:rgba(124,58,237,.18);--g2:rgba(34,229,201,.18)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{font-family:'Sora',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;
  background-image:radial-gradient(900px 500px at 10% -10%,var(--g1),transparent 60%),radial-gradient(800px 500px at 100% 10%,var(--g2),transparent 60%);background-attachment:fixed;transition:background-color .2s,color .2s}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
header{position:sticky;top:12px;z-index:20;margin:12px auto 0;max-width:1100px;padding:0 20px}
nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;border-radius:16px;background:var(--nav);border:1px solid rgba(124,92,255,.5);box-shadow:0 0 30px rgba(124,58,237,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.logo{font-weight:700;display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--grad);display:grid;place-items:center;font-style:normal;font-size:14px;color:#07121a}
.links{display:flex;align-items:center;gap:18px;font-size:14px;color:var(--muted)}
.links a:not(.btn):hover{color:var(--text)}
.tools{display:flex;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button,.theme{font:inherit;font-size:12px;font-weight:600;color:var(--muted);background:none;border:0;padding:7px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--grad);color:#fff}
.theme{border:1px solid var(--line);border-radius:10px;font-size:15px;line-height:1;padding:6px 9px}
.btn{display:inline-block;border:0;cursor:pointer;font:inherit;font-weight:600;font-size:14px;color:#06141a;padding:10px 18px;border-radius:10px;background:linear-gradient(135deg,var(--teal),#5eead4);box-shadow:0 0 22px rgba(34,229,201,.4);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 30px rgba(34,229,201,.65)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);box-shadow:none}
.btn.ghost:hover{border-color:var(--teal)}
.hero{padding:80px 0 40px;text-align:center}
.hero h1{font-size:clamp(32px,6vw,58px);line-height:1.1;letter-spacing:-.02em;max-width:820px;margin:0 auto 18px}
.hero p{max-width:620px;margin:0 auto 28px;color:var(--muted);font-size:17px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
section{padding:50px 0}
h2{font-size:clamp(24px,4vw,34px);margin-bottom:10px;letter-spacing:-.01em}
.sub{color:var(--muted);margin-bottom:28px;max-width:560px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{padding:22px}.card h3{font-size:17px;margin-bottom:6px}.card p{color:var(--muted);font-size:14px}
.ico{font-size:26px;margin-bottom:10px}
/* portfolio */
.proj{position:relative;overflow:hidden;min-height:230px;display:flex;flex-direction:column}
.vis{position:relative;overflow:hidden;aspect-ratio:11/5;background:#0d0b22}.vis img{display:block;width:100%;height:100%;object-fit:cover}
.vis::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(8,6,24,.6))}
.info{padding:14px 18px}.info b{display:block}.info small{color:var(--muted)}
.ov{position:absolute;inset:0;background:var(--ovl);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:12px;padding:20px;opacity:0;transition:opacity .2s}
.proj:hover .ov,.proj:focus-within .ov{opacity:1}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tags span{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--teal);color:var(--teal)}
.metric{font-size:20px;font-weight:700}
@media(hover:none){.ov{position:static;opacity:1;background:none;padding:0 18px 18px}}
/* testimonials */
.quote{padding:22px;display:flex;flex-direction:column;gap:16px;justify-content:space-between}
.quote p{font-size:15px}
.who{display:flex;gap:10px;align-items:center;font-size:13px}.who small{display:block;color:var(--muted)}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:700;color:#07121a}
.ticker{overflow:hidden;margin-top:28px;border-block:1px solid var(--line);padding:14px 0;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.track{display:flex;gap:48px;width:max-content;animation:tick 28s linear infinite;color:var(--muted);font-weight:600}
@keyframes tick{to{transform:translateX(-50%)}}
/* process */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;counter-reset:s}
.step{padding:22px;position:relative}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;font-weight:700;margin-bottom:12px}
.step h3{font-size:16px;margin-bottom:4px}.step p{font-size:14px;color:var(--muted)}
/* faq */
.faq{max-width:760px}
details{padding:16px 20px;margin-bottom:10px}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--teal);font-size:20px;line-height:1}
details[open] summary::after{content:"–"}
details p{margin-top:10px;color:var(--muted);font-size:14px}
/* booking */
.booking{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{padding:20px}.box h3{font-size:15px;margin-bottom:14px}.full{grid-column:1/-1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;color:var(--text);padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.chip:hover{border-color:var(--violet)}
.chip[aria-pressed="true"]{border-color:var(--teal);background:rgba(34,229,201,.14);box-shadow:0 0 14px rgba(34,229,201,.3)}
.chip:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.experts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.expert{display:flex;gap:12px;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;cursor:pointer;position:relative}
.expert[aria-pressed="true"]{border-color:var(--teal);box-shadow:0 0 16px rgba(34,229,201,.3)}
.expert[aria-pressed="true"]::after{content:"✓";position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;display:grid;place-items:center}
.expert b{display:block;font-size:14px}.expert small{color:var(--muted);font-size:12px;line-height:1.35;display:block}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-head button{background:none;border:1px solid var(--line);color:var(--text);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px}
.cal-head button:disabled{opacity:.3;cursor:not-allowed}
#month-label{font-size:15px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.dow{font-size:11px;color:var(--muted);padding-bottom:4px;text-transform:capitalize}
.day{aspect-ratio:1;border-radius:8px;border:0;font:inherit;font-size:13px;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(135deg,#6d28d9,#3b82f6)}
.day:hover:not(:disabled){transform:scale(1.08)}
.day:disabled{background:transparent;color:var(--dim);cursor:not-allowed;font-weight:400}
.day[aria-pressed="true"]{background:var(--teal);color:#06141a;box-shadow:0 0 16px rgba(34,229,201,.7)}
.blank{visibility:hidden}
.times{margin-top:18px}.times h3{margin-bottom:10px}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.wide{grid-column:1/-1}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
input,textarea{width:100%;font:inherit;font-size:14px;color:var(--text);background:var(--field);border:1px solid rgba(34,229,201,.4);border-radius:8px;padding:10px 12px}
input:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 12px rgba(34,229,201,.3)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}
.summary{font-size:13px;color:var(--muted)}
.err{color:#ff6b88;font-size:13px;min-height:18px;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(5,4,15,.75);display:none;place-items:center;z-index:50;padding:20px}
.modal.open{display:grid}
.modal .glass{background:var(--modal);max-width:420px;width:100%;padding:28px;text-align:center}
.tick{width:56px;height:56px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:26px;margin:0 auto 14px;color:#07121a}
.modal p{color:var(--muted);font-size:14px;margin:8px 0 20px}
footer{padding:40px 0 50px;color:var(--muted);font-size:13px;text-align:center;border-top:1px solid var(--line);margin-top:30px}
.plan{display:flex;flex-direction:column;gap:12px;position:relative}
.plan.feat{border-color:var(--teal);box-shadow:0 0 28px rgba(34,229,201,.2)}
.badge{position:absolute;top:-11px;right:16px;background:var(--grad);color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px}
.price{font-size:28px;font-weight:700}.price small{font-size:13px;font-weight:400;color:var(--muted)}
.plan ul{list-style:none;padding:0;display:grid;gap:8px;flex:1;font-size:14px;color:var(--muted)}
.plan li::before{content:"✓";color:var(--teal);margin-right:8px}
.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.plan .for{font-size:13px;color:var(--muted)}.plan .eta{font-size:13px;font-weight:600}
.est{margin-top:24px}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--panel);font-size:14px}
.opt:has(input:checked){border-color:var(--teal);box-shadow:0 0 14px rgba(34,229,201,.25)}
.opt small{color:var(--muted);white-space:nowrap}
.opt input{width:16px;height:16px;padding:0;border:0;background:none;margin-right:10px;accent-color:var(--teal);vertical-align:middle}
.total{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-top:18px}
.total small{display:block;color:var(--muted);font-size:12px}.total strong{font-size:24px}.total .btn{margin-left:auto}
.wa{position:fixed;right:18px;bottom:18px;z-index:30;width:54px;height:54px;border-radius:50%;background:#25d366;display:grid;place-items:center;font-size:26px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.wa[hidden]{display:none}
.bar-top{background:linear-gradient(90deg,#5b21b6,#1d4ed8);color:#fff;text-align:center;font-size:13px;padding:8px 44px;position:relative}
.bar-top a{color:#fff;font-weight:700;text-decoration:underline;margin-left:8px}
.bar-top button{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:#fff;font-size:18px;cursor:pointer;line-height:1;padding:4px 8px}
.tech{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tc{padding:20px;display:flex;gap:14px;align-items:flex-start;transition:transform .2s,border-color .2s,box-shadow .2s}
.tc:hover{transform:translateY(-3px);border-color:var(--teal);box-shadow:0 0 24px rgba(34,229,201,.35),inset 0 0 18px rgba(34,229,201,.08)}
.tg{flex:none;width:44px;height:44px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;box-shadow:0 0 16px rgba(124,58,237,.5)}
.tc b{display:block;margin-bottom:2px}.tc p{font-size:13px;color:var(--muted)}
.founder{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start}
.fcard{padding:18px;text-align:center;border-color:rgba(124,92,255,.65);box-shadow:0 0 36px rgba(124,58,237,.4),0 0 70px rgba(59,130,246,.22)}
.fcard .tags span{box-shadow:0 0 12px rgba(34,229,201,.35)}
.fname{font-size:22px;margin-bottom:2px}.fbio small{display:block;color:var(--muted);margin-bottom:16px}
.fav{width:96px;height:96px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:34px;font-weight:700;color:#fff;margin:0 auto 14px;box-shadow:0 0 28px rgba(124,58,237,.5)}
.fphoto{display:block;width:100%;height:auto;aspect-ratio:3/4;object-fit:cover;object-position:center 40%;border-radius:14px;margin-bottom:16px;box-shadow:0 0 28px rgba(124,58,237,.35)}
.fcard h3{font-size:18px}.fcard small{color:var(--muted);display:block;margin-bottom:14px}.fcard .tags{justify-content:center}
.fbio{padding:26px}.fbio p{color:var(--muted);margin-bottom:14px;max-width:70ch}.fbio p:last-child{margin-bottom:0}
.xin{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.xin input{flex:1;min-width:180px}
@media(max-width:900px){.links a:not(.btn){display:none}.steps{grid-template-columns:1fr 1fr}.founder{grid-template-columns:1fr}.tech,.plans{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.grid3,.booking,.form,.experts,.steps{grid-template-columns:1fr}.links .btn{display:none}.hero{padding-top:50px}.logo span{display:none}.opts,.tech,.plans{grid-template-columns:1fr}.total .btn{margin-left:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.track{animation:none}}
</style>
</head>
<body>
<div class="bar-top" id="bn"><span id="bn-t"></span><a href="#book" id="bn-c"></a><button id="bn-x" type="button">×</button></div>
<header><nav>
  <a href="#top" class="logo"><i>e</i><span>eProgram Agency</span></a>
  <div class="links">
    <a href="#top" data-i18n="nav_home"></a><a href="#services" data-i18n="nav_services"></a><a href="#portfolio" data-i18n="nav_work"></a><a href="#pricing" data-i18n="nav_pricing"></a>
    <a href="#about" data-i18n="nav_about"></a><a href="#faq" data-i18n="nav_faq"></a>
    <a href="#book" class="btn" data-i18n="nav_book"></a>
  </div>
  <div class="tools">
    <div class="seg" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="ro">RO</button><button data-lang="ru">RU</button></div>
    <button class="theme" id="theme" type="button"></button>
  </div>
</nav></header>

<main id="top">
  <div class="wrap hero">
    <h1 data-i18n="hero_h"></h1>
    <p data-i18n="hero_p"></p>
    <div class="row"><a class="btn" href="#book" data-i18n="hero_c1"></a><a class="btn ghost" href="#portfolio" data-i18n="hero_c2"></a></div>
  </div>

  <section id="services"><div class="wrap">
    <h2 data-i18n="svc_h"></h2>
    <div class="grid3" style="margin-top:24px">
      <div class="glass card"><div class="ico">📅</div><h3 data-i18n="c1t"></h3><p data-i18n="c1d"></p></div>
      <div class="glass card"><div class="ico">💈</div><h3 data-i18n="c2t"></h3><p data-i18n="c2d"></p></div>
      <div class="glass card"><div class="ico">⚡</div><h3 data-i18n="c3t"></h3><p data-i18n="c3d"></p></div>
    </div>
  </div></section>

  <!-- Concept demos: replace with real client projects once you have them -->
  <section id="portfolio"><div class="wrap">
    <h2 data-i18n="pf_h"></h2><p class="sub" data-i18n="pf_p"></p>
    <div class="grid3">
      <article class="glass proj"><div class="vis"><img id="p1-img" src="demo-barbershop.jpg" width="900" height="409" alt="" loading="lazy"></div>
        <div class="info"><b>Fade &amp; Blade</b><small data-i18n="ty1"></small></div>
        <div class="ov"><div class="tags"><span>HTML</span><span>CSS</span><span>JS</span></div><div class="metric" data-i18n="m1"></div><a class="btn" href="#book" data-i18n="pf_demo"></a></div></article>
      <article class="glass proj"><div class="vis"><img id="p2-img" src="demo-beauty.jpg" width="900" height="409" alt="" loading="lazy"></div>
        <div class="info"><b>Lumina Studio</b><small data-i18n="ty2"></small></div>
        <div class="ov"><div class="tags"><span>HTML</span><span>CSS</span><span>JS</span></div><div class="metric" data-i18n="m2"></div><a class="btn" href="#book" data-i18n="pf_demo"></a></div></article>
      <article class="glass proj"><div class="vis"><img id="p3-img" src="demo-nails.jpg" width="900" height="409" alt="" loading="lazy"></div>
        <div class="info"><b>Nail Atelier</b><small data-i18n="ty3"></small></div>
        <div class="ov"><div class="tags"><span>HTML</span><span>JS</span><span>Web3Forms</span></div><div class="metric" data-i18n="m3"></div><a class="btn" href="#book" data-i18n="pf_demo"></a></div></article>
    </div>
  </div></section>

  <section id="why"><div class="wrap">
    <h2 data-i18n="ts_h" style="margin-bottom:8px"></h2><p class="sub" data-i18n="ts_p"></p>
    <div class="grid3">
      <div class="glass card"><div class="ico">🚀</div><h3 data-i18n="w1t"></h3><p data-i18n="w1d"></p></div>
      <div class="glass card"><div class="ico">🛠️</div><h3 data-i18n="w2t"></h3><p data-i18n="w2d"></p></div>
      <div class="glass card"><div class="ico">💬</div><h3 data-i18n="w3t"></h3><p data-i18n="w3d"></p></div>
    </div>
  </div></section>

  <section id="tech"><div class="wrap">
    <h2 data-i18n="tc_h"></h2><p class="sub" data-i18n="tc_p"></p>
    <div class="tech">
      <div class="glass tc"><span class="tg">H5</span><div><b>HTML5 &amp; CSS3</b><p data-i18n="tc1d"></p></div></div>
      <div class="glass tc"><span class="tg">JS</span><div><b>JavaScript</b><p data-i18n="tc2d"></p></div></div>
      <div class="glass tc"><span class="tg">TW</span><div><b>Tailwind CSS</b><p data-i18n="tc3d"></p></div></div>
      <div class="glass tc"><span class="tg">W3</span><div><b>Web3Forms</b><p data-i18n="tc4d"></p></div></div>
      <div class="glass tc"><span class="tg">GH</span><div><b>GitHub Pages</b><p data-i18n="tc5d"></p></div></div>
      <div class="glass tc"><span class="tg">J</span><div><b>Java &amp; SQL</b><p data-i18n="tc6d"></p></div></div>

/* ===== APP ===== */
const LANGS = ["en","ro","ru"], LOC = {en:"en-GB", ro:"ro-RO", ru:"ru-RU"};
const $ = id => document.getElementById(id);
const store = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };
let L = LANGS.indexOf(store.get("lang"));
if(L < 0){ const n = (navigator.language||"en").slice(0,2); L = Math.max(0, LANGS.indexOf(n)); }
const t = k => I18N[k][L];
const loc = () => LOC[LANGS[L]];
const fmtLong = (d, l=loc()) => d.toLocaleDateString(l, {weekday:"long", day:"numeric", month:"long", year:"numeric"});

const state = { service:null, expert:null, date:null, time:null };
const today = new Date(); today.setHours(0,0,0,0);
let view = new Date(today.getFullYear(), today.getMonth(), 1);

function btn(cls, text, pressed, onclick, disabled){
  const b = document.createElement("button");
  b.type = "button"; b.className = cls; b.textContent = text;
  if(pressed !== null) b.setAttribute("aria-pressed", pressed);
  b.disabled = !!disabled; b.onclick = onclick; return b;
}
function drawServices(){
  const el = $("services-chips"); el.innerHTML = "";
  SERVICES_EN.forEach((_, i) => el.appendChild(btn("chip", t("sv"+(i+1)), state.service === i, () => { state.service = i; drawServices(); update(); })));
}
function drawExperts(){
  const el = $("experts"); el.innerHTML = "";
  CONFIG.experts.forEach((name, i) => {
    const b = btn("expert", "", state.expert === i, () => { state.expert = i; drawExperts(); drawTimes(); update(); });
    b.innerHTML = `<span class="av">${name[0]}</span><span><b>${name}</b><small>${t("ex"+(i+1))}</small></span>`;
    el.appendChild(b);
  });
}
function drawCal(){
  const cal = $("cal"); cal.innerHTML = "";
  $("month-label").textContent = view.toLocaleDateString(loc(), {month:"long", year:"numeric"});
  for(let i = 0; i < 7; i++){ const s = document.createElement("div"); s.className = "dow"; s.textContent = new Date(2024,0,1+i).toLocaleDateString(loc(), {weekday:"short"}); cal.appendChild(s); }
  const first = (new Date(view.getFullYear(), view.getMonth(), 1).getDay() + 6) % 7;
  const days = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
  for(let i = 0; i < first; i++){ const s = document.createElement("span"); s.className = "blank"; cal.appendChild(s); }
  for(let n = 1; n <= days; n++){
    const d = new Date(view.getFullYear(), view.getMonth(), n);
    const b = btn("day", n, !!state.date && +state.date === +d, () => { state.date = d; state.time = null; drawCal(); drawTimes(); update(); }, d < today || CONFIG.closedWeekdays.includes(d.getDay()));
    b.setAttribute("aria-label", fmtLong(d)); cal.appendChild(b);
  }
  $("prev").disabled = view <= new Date(today.getFullYear(), today.getMonth(), 1);
}
/* Demo only: some slots appear taken. Replace with real availability from a backend later. */
const taken = (d, tm) => (d.getDate()*7 + d.getMonth()*3 + CONFIG.times.indexOf(tm)*5 + (state.expert||0)*2) % 5 === 0;
function drawTimes(){
  const el = $("times-chips"); el.innerHTML = "";
  if(!state.date){ el.innerHTML = `<span class="summary">${t("pick")}</span>`; return; }
  CONFIG.times.forEach(tm => el.appendChild(btn("chip", tm, state.time === tm, () => { state.time = tm; drawTimes(); update(); }, taken(state.date, tm))));
}
function summaryText(){
  return [state.service !== null && t("sv"+(state.service+1)), state.expert !== null && CONFIG.experts[state.expert],
    state.date && state.date.toLocaleDateString(loc(), {day:"numeric", month:"short"}), state.time].filter(Boolean).join(", ");
}
function update(){ $("summary").textContent = summaryText() || t("sum_empty"); $("err").textContent = ""; }

const picked = new Set();
const money = n => new Intl.NumberFormat(loc(), {style:"currency", currency:CONFIG.currency, maximumFractionDigits:0}).format(n);
function prefill(text){ $("note").value = text; $("book").scrollIntoView(); $("name").focus({preventScroll:true}); }
function drawTotal(){
  const sel = CONFIG.options.filter(o => picked.has(o.id));
  const price = sel.reduce((a,o) => a+o.price, 0), days = sel.reduce((a,o) => a+o.days, 0);
  $("es-price").textContent = sel.length ? money(price) : "—";
  $("es-days").textContent = sel.length ? "≈ "+days : "—";
  $("es-cta").disabled = !sel.length;
  $("es-cta").onclick = () => prefill(`Estimate: ${sel.map(o => I18N["o_"+o.id][0]).join(", ")}. About ${price} ${CONFIG.currency}, ~${days} working days.`);
}
function drawPricing(){
  const pl = $("plans"); pl.innerHTML = "";
  CONFIG.plans.forEach(p => {
    const c = document.createElement("div"); c.className = "glass card plan" + (p.featured ? " feat" : "");
    c.innerHTML = `${p.featured ? `<span class="badge">${t("pr_rec")}</span>` : ""}<h3>${t("pl"+p.id+"n")}</h3>
      <div class="for">${t("pl"+p.id+"w")}</div>
      <div class="price">${p.monthly ? `${money(p.price)} <small>${t("pr_month")}</small>` : `<small>${t("pr_from")}</small> ${money(p.price)}`}</div>
      <ul>${t("pl"+p.id+"f").split("|").map(f => `<li>${f}</li>`).join("")}</ul>${I18N["pl"+p.id+"t"] ? `<div class="eta">${t("pl"+p.id+"t")}</div>` : ""}`;
    c.appendChild(btn("btn" + (p.featured ? "" : " ghost"), t("pr_select"), null, () => prefill("Plan: " + I18N["pl"+p.id+"n"][0] + (p.monthly ? ` (${p.price} ${CONFIG.currency} / month)` : ` (from ${p.price} ${CONFIG.currency})`))));
    pl.appendChild(c);
  });
  const op = $("opts"); op.innerHTML = "";
  CONFIG.options.forEach(o => {
    const l = document.createElement("label"); l.className = "opt";
    l.innerHTML = `<span><input type="checkbox" ${picked.has(o.id) ? "checked" : ""}>${t("o_"+o.id)}</span><small>+${money(o.price)}</small>`;
    l.querySelector("input").onchange = e => { e.target.checked ? picked.add(o.id) : picked.delete(o.id); drawTotal(); };
    op.appendChild(l);
  });
  drawTotal();
}
function drawFaq(){
  const box = $("faq-list"); box.innerHTML = "";
  for(let i = 1; i <= 10; i++){
    const d = document.createElement("details"); d.className = "glass";
    const q = document.createElement("summary"); q.textContent = t("q"+i);
    const a = document.createElement("p"); a.textContent = t("a"+i).replace("{wa}", CONFIG.whatsapp ? t("a10w") : "");
    d.append(q, a); box.appendChild(d);
  }
}
function drawWa(){
  const a = $("wa"); if(!CONFIG.whatsapp) return;
  a.hidden = false; a.href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(t("wa_msg"))}`; a.setAttribute("aria-label", t("wa_label"));
}

const ss = { get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}} };
async function sendLead(data, subject){
  const endpoint = CONFIG.web3formsKey ? "https://api.web3forms.com/submit" : CONFIG.formEndpoint;
  if(!endpoint) return false;
  const payload = CONFIG.web3formsKey ? { access_key:CONFIG.web3formsKey, subject, from_name:"eProgram Agency", ...data } : { subject, ...data };
  const r = await fetch(endpoint, { method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"}, body:JSON.stringify(payload) });
  return r.ok;
}
function drawExtras(){
  $("bn-t").textContent = "⚡ " + (CONFIG.bannerSlots ? t("bn_slots").replace("{n}", CONFIG.bannerSlots) : t("bn_txt"));
  $("bn-c").textContent = t("bn_cta");
  $("bn-x").setAttribute("aria-label", t("close"));
  $("f-img").alt = t("f_alt");
  [["p1-img","Fade & Blade","ty1"],["p2-img","Lumina Studio","ty2"],["p3-img","Nail Atelier","ty3"]].forEach(([i,n,k]) => $(i).alt = n + " – " + t(k));
  $("f-tags").innerHTML = t("f_certs").split("|").map(x => `<span>${x}</span>`).join("");
}
$("bn-x").onclick = () => $("bn").hidden = true;

/* Exit-intent popup: desktop only, once per visit, never while the visitor is filling the form */
const t0 = Date.now();
function closeExit(){ $("exit").classList.remove("open"); }
document.addEventListener("mouseout", e => {
  if(e.relatedTarget || e.clientY > 0 || ss.get("exit") || Date.now() - t0 < 8000) return;
  if(!matchMedia("(pointer:fine)").matches || document.querySelector(".modal.open") || $("name").value || $("email").value) return;
  ss.set("exit", "1"); $("exit").classList.add("open"); $("ex-phone").focus();
});
$("ex-no").onclick = closeExit;
$("exit").addEventListener("click", e => { if(e.target === $("exit")) closeExit(); });
$("ex-send").onclick = async () => {
  const v = $("ex-phone").value.trim(), err = $("ex-err"); err.textContent = "";
  if(v.replace(/\D/g,"").length < 8) return err.textContent = t("e_phone");
  $("ex-send").disabled = true;
  try{
    if(!await sendLead({ whatsapp:v, message:"Visitor left a WhatsApp number for a quick demo (exit popup)", language:LANGS[L] }, "Demo request")) throw 0;
    $("ex-p").textContent = t("ex_ok"); $("ex-form").hidden = true; setTimeout(closeExit, 2500);
  }catch(e){ $("ex-send").disabled = false; err.textContent = t("e_send"); }
};

function applyLang(){
  document.documentElement.lang = LANGS[L]; document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll("[data-ph]").forEach(e => e.placeholder = t(e.dataset.ph));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === LANGS[L]));
  $("theme").setAttribute("aria-label", t("theme"));
  drawServices(); drawExperts(); drawCal(); drawTimes(); update(); drawPricing(); drawFaq(); drawWa(); drawExtras();
}
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { L = LANGS.indexOf(b.dataset.lang); store.set("lang", b.dataset.lang); applyLang(); });

function setTheme(v){ document.documentElement.dataset.theme = v; store.set("theme", v); $("theme").textContent = v === "dark" ? "☀" : "☾"; }
$("theme").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
setTheme(store.get("theme") || "dark");

async function confirmBooking(){
  const name = $("name").value.trim(), email = $("email").value.trim(), phone = $("phone").value.trim(), err = $("err");
  const check = [[state.service===null,"e_svc"],[state.expert===null,"e_exp"],[!state.date,"e_date"],[!state.time,"e_time"],[!name,"e_name"],
    [!/^\S+@\S+\.\S+$/.test(email),"e_email"],[phone.replace(/\D/g,"").length < 6,"e_phone"]].find(c => c[0]);
  if(check) return err.textContent = t(check[1]);

  const booking = { service:SERVICES_EN[state.service], expert:CONFIG.experts[state.expert], date:fmtLong(state.date,"en-GB"), time:state.time,
    name, email, phone, note:$("note").value.trim(), language:LANGS[L] };
  const b = $("confirm"); b.disabled = true;
  const endpoint = CONFIG.web3formsKey ? "https://api.web3forms.com/submit" : CONFIG.formEndpoint;
  if(endpoint){
    try{
      const payload = CONFIG.web3formsKey ? { access_key:CONFIG.web3formsKey, subject:"New booking: "+booking.service, from_name:"eProgram Agency", replyto:booking.email, ...booking } : booking;
      const r = await fetch(endpoint, { method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"}, body:JSON.stringify(payload) });
      if(!r.ok) throw new Error();
    }catch(e){ b.disabled = false; return err.textContent = t("e_send"); }
  }else{
    const body = Object.entries(booking).map(([k,v]) => `${k}: ${v}`).join("\n");
    location.href = `mailto:${CONFIG.ownerEmail}?subject=${encodeURIComponent("New booking: "+booking.service)}&body=${encodeURIComponent(body)}`;
  }
  if(endpoint){
    const pad = n => String(n).padStart(2,"0"), d = state.date;
    const q = new URLSearchParams({ s:state.service, e:CONFIG.experts[state.expert], d:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, tm:state.time });
    location.href = "thank-you.html?" + q; return;
  }
  b.disabled = false;
  $("m-text").textContent = `${summaryText()}. ${t("m_text")} ${email}.`;
  $("modal").classList.add("open"); $("m-close").focus();
}

$("prev").onclick = () => { view = new Date(view.getFullYear(), view.getMonth()-1, 1); drawCal(); };
$("next").onclick = () => { view = new Date(view.getFullYear(), view.getMonth()+1, 1); drawCal(); };
$("confirm").onclick = confirmBooking;
$("m-close").onclick = () => $("modal").classList.remove("open");
document.addEventListener("keydown", e => { if(e.key === "Escape"){ $("modal").classList.remove("open"); closeExit(); } });
$("year").textContent = new Date().getFullYear();


if(CONFIG.calendlyUrl){
  $("calbox").hidden = false;
  const f = document.createElement("iframe");
  f.src = CONFIG.calendlyUrl; f.title = "Calendar"; f.loading = "lazy";
  f.style.cssText = "width:100%;height:680px;border:0;border-radius:12px"; $("calframe").appendChild(f);
}
applyLang();
</script>
</body>
</html>
